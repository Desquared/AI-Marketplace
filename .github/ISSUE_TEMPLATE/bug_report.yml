name: Bug Report
description: Report a broken plugin skill, hook, MCP connection, or install.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include credentials, tokens, tenant data or customer data.** For security issues, follow SECURITY.md instead of opening an issue.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - wave-cxm
        - Marketplace or install
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Claude Code
        - GitHub Copilot CLI
        - OpenAI Codex
        - Cursor
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin and runtime versions
      placeholder: "wave-cxm 1.0.1, Claude Code 2.x"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Redact any tenant names, ids or data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
